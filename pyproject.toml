[project]
name = "bot-chain-api"
version = "0.1.0"
description = "BOT Chain 全功能链上服务（ETH Wuhan 2026 赛题接入后端）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "web3>=7.0,<8",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "duckdb>=1.0",
    "redis>=5.0",
    "cryptography>=43.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "fakeredis>=2.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
asyncio_mode = "auto"
markers = [
    "unit: 离线单元测试（RPC/HTTP 全 mock，无网络）",
    "live: 打真实测试网 968 的只读用例",
    "needs_funds: 需要测试网 BOT 余额的写用例（无私钥则显式 skip）",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "T20", "S", "ANN", "PL"]
ignore = [
    "PLR0913",     # FastAPI 依赖注入参数多属正常
    "RUF001",      # 中文文档：全角标点误报（C-02 沉淀，见 CONSTRAINTS.md）
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "S105", "S106"]  # C-02 断言字面量；C-06 代币域 token_* 字段名触发 S105 误报
"app/web/**" = ["E501"]           # 单文件 playground 页放宽行长
"app/storage/**" = ["ANN401"]     # JSON 序列化边界，Any 是正确类型（C-09）
"scripts/**" = ["T20", "PLR0915", "PLR2004"]  # CLI 演示脚本：输出/步骤流/断言字面量即剧本（C-12）

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["app"]
