[project]
name = "coincall-gateway"
version = "0.1.0"
description = "CoinCall 数据面：402 付费网关（X-PAYMENT 验签 + 影子闸门 + settle 队列，ETH Wuhan 2026）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "duckdb>=1.0",
    "web3>=7.0,<8",
    "eth-account>=0.13",
    "eth-keys>=0.5",
    "eth-utils>=5.0",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "respx==0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
asyncio_mode = "auto"
markers = [
    "unit: 离线单元测试（RPC/HTTP 全 mock，零网络；DuckDB 用 tmp_path）",
    "live: 打真实测试网 968 的只读用例（rpc.bohr.life）",
    "needs_funds: 需要测试网余额的写用例（P0 阶段无）",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "T20", "S", "ANN", "PL"]
ignore = [
    "PLR0913",     # FastAPI 依赖注入参数多属正常
    "RUF001",      # 中文文档：全角标点误报（移植 bot-chain-api C-02 沉淀）
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "S105", "S106", "PLC0415"]  # 断言字面量/无注解/函数内 import（C-02；夹具延迟装配）
"app/modules/**" = ["ANN401"]     # JSON 序列化边界，Any 是正确类型（bot-chain-api C-09）

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "eth_keys.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
