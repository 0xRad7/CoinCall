[project]
name = "bot-chain-api"
version = "0.1.0"
description = "BOT Chain 全功能链上服务（ETH Wuhan 2026 赛题接入后端）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "web3>=7.0,<8",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "duckdb>=1.0",
    "redis>=5.0",
    "cryptography>=43.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "fakeredis>=2.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
markers = [
    "unit: 离线单元测试（RPC/HTTP 全 mock，无网络）",
    "live: 打真实测试网 968 的只读用例",
    "needs_funds: 需要测试网 BOT 余额的写用例（无私钥则显式 skip）",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "T20", "S", "ANN", "PL"]
ignore = ["PLR0913"]  # FastAPI 依赖注入参数多属正常

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]      # 测试允许 assert、放宽注解
"app/web/**" = ["E501"]           # 单文件 playground 页放宽行长

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["app"]
