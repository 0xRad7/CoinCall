[project]
name = "coincall-contracts"
version = "0.1.0"
description = "PayVault 结算合约仓（ETH Wuhan 2026 CoinCall）：Solidity 合约 + Python 编译/测试/部署全链路"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "py-solc-x>=2.0",
    "web3>=7.0,<8",
    "eth-account>=0.13",
    "eth-tester[py-evm]>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["payvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -m 'not needs_funds'"
markers = [
    "unit: 离线单元测试（eth-tester 本地 EVM，无网络）",
    "needs_funds: 需要测试网 BOT 余额与私钥的真实写用例（默认排除，显式 -m needs_funds 运行）",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "T20", "S", "ANN", "PL"]
ignore = [
    "PLR0913",     # 部署/编译入口参数多属正常
    "RUF001",      # 中文文档：全角标点误报（对齐 coincall-bot-chain-api C-02 沉淀）
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "S105", "S106"]  # 断言字面量；测试不强制注解
"script/**" = ["T20", "PLR0915", "PLR2004", "PLR0912"]   # CLI 脚本：输出即剧本（对齐 bot-chain-api C-12）
"vectors/**" = ["T20"]

[tool.mypy]
python_version = "3.11"
files = ["payvault", "script"]
disallow_untyped_defs = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["eth_keys.*", "solcx.*", "eth_tester.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["payvault"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
